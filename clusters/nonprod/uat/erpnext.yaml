cluster:
  name: cluster-nonprod
erpnext:
  image:
    repository: 123456789012.dkr.ecr.us-east-1.amazonaws.com/nonprod/erpnext
    tag: sha-example
    digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  dbHost: db.example.internal
frappe:
  sites:
    - siteName: erpnext-uat.example.internal
      installApps:
        - erpnext
platform:
  ingress:
    host: erpnext-uat.example.internal
  externalSecrets:
    db:
      remoteRef:
        key: apps/erpnext/uat/db
    admin:
      remoteRef:
        key: apps/erpnext/uat/admin
    rdsMaster:
      remoteRef:
        key: apps/erpnext/rds-master
